services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govparcerias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
