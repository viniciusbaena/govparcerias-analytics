services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: painel_transferegov
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      TRANSFEREGOV_PARCERIAS_BASE_URL: https://api-publica.transferegov.gestao.gov.br/parcerias
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
