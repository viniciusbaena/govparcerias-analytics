name: Qualidade
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validar JSON
        run: python -m json.tool site/data/demo.json >/dev/null && python -m json.tool site/data/schema-catalog.json >/dev/null
      - name: Validar Python
        run: python -m compileall -q backend/app
      - name: Validar JavaScript
        run: node --check site/assets/app.js
      - name: Verificar segredos comuns
        run: '! grep -RIE "(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*[^[:space:]]+)" --exclude-dir=.git .'
